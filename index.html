<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qorxuevi.az - Həyəcanın Tək Ünvanı</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Iconlar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #08080a;
            --accent-red: #ff003c;
            --accent-glow: rgba(255, 0, 60, 0.4);
            --card-bg: #121216;
        }

        body {
            background-color: var(--bg-dark);
            color: #e2e8f0;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }

        .font-horror {
            font-family: 'Creepster', cursive;
        }

        .font-tech {
            font-family: 'Orbitron', sans-serif;
        }

        /* Peşəkar Səhifə Keçid Animasiyaları */
        .page-view {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .page-view.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* Glitch Effekti */
        .glitch-text {
            text-shadow: 0 0 10px var(--accent-red), 0 0 20px var(--accent-red);
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { text-shadow: 0 0 5px var(--accent-red); }
            100% { text-shadow: 0 0 25px var(--accent-red), 0 0 35px red; }
        }

        /* Kart Hover Pop-up Məlumat Paneli */
        .game-card {
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 10px 30px rgba(255, 0, 60, 0.3);
        }

        .hover-info-box {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            width: 90%;
            background: rgba(18, 18, 22, 0.95);
            border: 1px solid var(--accent-red);
            backdrop-filter: blur(10px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 20;
            pointer-events: none;
        }

        .game-card:hover .hover-info-box {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(-15px);
        }

        /* Qırmızı Neon Düymələr */
        .btn-horror {
            background: linear-gradient(45deg, #80001a, var(--accent-red));
            box-shadow: 0 0 15px var(--accent-glow);
            transition: all 0.3s ease;
        }

        .btn-horror:hover {
            box-shadow: 0 0 25px rgba(255, 0, 60, 0.8);
            transform: translateY(-2px);
        }

        /* Xüsusi Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #08080a;
        }
        ::-webkit-scrollbar-thumb {
            background: #33000d;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-red);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- NAVİQASİYA VƏ ŞƏHƏR SEÇİM PANELERİ -->
    <header class="sticky top-0 z-50 bg-black/80 backdrop-blur-md border-b border-red-900/40 px-4 py-3">
        <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4">
            
            <!-- Logo -->
            <div onclick="navigateTo('home-page')" class="cursor-pointer flex items-center space-x-2">
                <i class="fa-solid fa-ghost text-red-600 text-3xl animate-bounce"></i>
                <span class="font-horror text-3xl tracking-widest text-red-600 glitch-text">QORXUEVI.AZ</span>
            </div>

            <!-- Şəhər Filtri Paneli -->
            <div class="flex items-center space-x-2 bg-zinc-900/90 border border-zinc-800 rounded-lg p-1.5">
                <i class="fa-solid fa-location-dot text-red-500 ml-2"></i>
                <select id="city-select" onchange="filterGamesByCity()" class="bg-transparent text-white font-medium focus:outline-none cursor-pointer pr-4 text-sm md:text-base">
                    <option value="all" class="bg-zinc-900 text-white">Bütün Şəhərlər</option>
                    <option value="baku" class="bg-zinc-900 text-white">Bakı</option>
                    <option value="gence" class="bg-zinc-900 text-white">Gəncə</option>
                </select>
            </div>
        </div>
    </header>

    <!-- ƏSAS MƏZMUN KONTEYNERİ -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">

        <!-- ================= 1. ANA SƏHİFƏ (OYUNLAR SƏHİFƏSİ) ================= -->
        <section id="home-page" class="page-view active">
            <!-- Hero Banner -->
            <div class="text-center my-8">
                <h1 class="font-horror text-5xl md:text-7xl text-red-600 tracking-wider mb-2">QORXULARINLA ÜZLƏŞ</h1>
                <p class="text-zinc-400 text-lg md:text-xl font-light">Şəhərin ən dəhşətli və həyəcanlı qorxu evlərinə onlayn rezervasiya et!</p>
            </div>

            <!-- Oyunların 2-li Setka Düzülüşü (Grid) -->
            <div id="games-container" class="grid grid-cols-1 md:grid-cols-2 gap-8 my-10">
                <!-- Oyun kartları JS vasitəsilə dinamik yüklənir -->
            </div>
        </section>

        <!-- ================= 2. OYUN DETAL VƏ REZERVA SƏHİFƏSİ ================= -->
        <section id="detail-page" class="page-view">
            <button onclick="navigateTo('home-page')" class="mb-6 flex items-center text-zinc-400 hover:text-red-500 transition font-bold">
                <i class="fa-solid fa-arrow-left mr-2"></i> Geri Qayıt
            </button>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Sol Tərəf: Media & Haqqında -->
                <div class="lg:col-span-2 space-y-6">
                    <h2 id="detail-title" class="font-horror text-4xl md:text-5xl text-red-600 tracking-wide"></h2>
                    
                    <!-- Şəkil Qutusu -->
                    <div class="relative w-full h-72 md:h-96 rounded-xl overflow-hidden border border-red-900/50 shadow-2xl bg-zinc-900">
                        <img id="detail-image" src="" alt="Oyun Şəkli" class="w-full h-full object-cover">
                    </div>

                    <!-- Xüsusiyyətlər -->
                    <div class="grid grid-cols-3 gap-4 text-center">
                        <div class="bg-zinc-900/80 p-4 rounded-lg border border-zinc-800">
                            <i class="fa-solid fa-users text-red-500 text-2xl mb-1"></i>
                            <div class="text-xs text-zinc-400">Oyunçu Sayı</div>
                            <div id="detail-players" class="font-bold text-white"></div>
                        </div>
                        <div class="bg-zinc-900/80 p-4 rounded-lg border border-zinc-800">
                            <i class="fa-solid fa-clock text-red-500 text-2xl mb-1"></i>
                            <div class="text-xs text-zinc-400">Müddət</div>
                            <div id="detail-duration" class="font-bold text-white"></div>
                        </div>
                        <div class="bg-zinc-900/80 p-4 rounded-lg border border-zinc-800">
                            <i class="fa-solid fa-star text-yellow-500 text-2xl mb-1"></i>
                            <div class="text-xs text-zinc-400">Reytinq</div>
                            <div id="detail-rating" class="font-bold text-yellow-500"></div>
                        </div>
                    </div>
                </div>

                <!-- Sağ Tərəf: Rezervasiya Forması -->
                <div class="bg-zinc-900/90 border border-red-900/60 p-6 rounded-xl h-fit shadow-2xl">
                    <h3 class="font-tech text-2xl font-bold text-white mb-6 border-b border-zinc-800 pb-3 flex items-center">
                        <i class="fa-solid fa-calendar-check text-red-600 mr-2"></i> REZERVA SİYA ET
                    </h3>

                    <form id="booking-form" onsubmit="handleBookingSubmit(event)" class="space-y-4">
                        <input type="hidden" id="booking-game-id">
                        
                        <div>
                            <label class="block text-xs text-zinc-400 uppercase font-semibold mb-1">Ad və Soyad</label>
                            <input type="text" required id="book-name" placeholder="Məsələn: Əli Əliyev" class="w-full bg-black/60 border border-zinc-700 rounded p-2.5 text-white focus:outline-none focus:border-red-600 transition">
                        </div>

                        <div>
                            <label class="block text-xs text-zinc-400 uppercase font-semibold mb-1">Telefon Nömrəsi</label>
                            <input type="tel" required id="book-phone" placeholder="050 123 45 67" class="w-full bg-black/60 border border-zinc-700 rounded p-2.5 text-white focus:outline-none focus:border-red-600 transition">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs text-zinc-400 uppercase font-semibold mb-1">Tarix</label>
                                <input type="date" required id="book-date" class="w-full bg-black/60 border border-zinc-700 rounded p-2.5 text-white focus:outline-none focus:border-red-600 transition">
                            </div>
                            <div>
                                <label class="block text-xs text-zinc-400 uppercase font-semibold mb-1">Saat</label>
                                <input type="time" required id="book-time" class="w-full bg-black/60 border border-zinc-700 rounded p-2.5 text-white focus:outline-none focus:border-red-600 transition">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs text-zinc-400 uppercase font-semibold mb-1">Oyunçu Sayı</label>
                            <select id="book-count" class="w-full bg-black/60 border border-zinc-700 rounded p-2.5 text-white focus:outline-none focus:border-red-600 transition">
                                <option value="2-4 Nəfər">2 - 4 Nəfər</option>
                                <option value="5-8 Nəfər">5 - 8 Nəfər</option>
                                <option value="8+ Nəfər">8+ Nəfər</option>
                            </select>
                        </div>

                        <button type="submit" class="w-full btn-horror text-white font-bold py-3 rounded-lg tracking-wider text-base mt-4">
                            REZERVASIYANI TƏSDİQLƏ
                        </button>
                    </form>
                </div>
            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="border-t border-zinc-900 py-6 text-center text-xs text-zinc-500 mt-12">
        <p>© 2026 QORXUEVI.AZ — Bütün hüquqlar qorunur.</p>
    </footer>

    <!-- JS LOGİKA VƏ REAL MƏLUMAT BAZASI -->
    <script>
        // YALNIZ İSTƏNİLƏN MƏLUMATLAR VƏ TEHLUKE.PNG SURATI
        const gamesData = [
            {
                id: "tehluke",
                title: "Təhlükə",
                rating: "⭐⭐⭐⭐⭐",
                duration: "Zaman limitsiz",
                players: "2-20",
                city: "baku",
                cityLabel: "Bakı",
                image: "Tehluke.PNG"
            },
            {
                id: "dont-breathe",
                title: "Dont Breathe (Nəfəsini Tut)",
                rating: "⭐⭐⭐⭐⭐",
                duration: "60 dq",
                players: "2-8",
                city: "baku",
                cityLabel: "Bakı",
                image: "https://images.unsplash.com/photo-1509248961158-e54f6934749c?auto=format&fit=crop&w=800&q=80"
            },
            {
                id: "gizlen-qac",
                title: "Gizlən qaç",
                rating: "⭐⭐⭐⭐⭐",
                duration: "Zaman limitsiz",
                players: "2-20",
                city: "baku",
                cityLabel: "Bakı",
                image: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80"
            }
        ];

        // SƏHİFƏ YÜKLƏNƏNDƏ
        window.addEventListener('DOMContentLoaded', () => {
            renderGames('all');
            setupDateInput();
        });

        function setupDateInput() {
            const dateInput = document.getElementById('book-date');
            if(dateInput) {
                const today = new Date().toISOString().split('T')[0];
                dateInput.min = today;
            }
        }

        // SƏHİFƏLƏR ARASI KEÇİD
        function navigateTo(pageId) {
            const pages = document.querySelectorAll('.page-view');
            pages.forEach(p => p.classList.remove('active'));

            setTimeout(() => {
                pages.forEach(p => p.style.display = 'none');
                const targetPage = document.getElementById(pageId);
                targetPage.style.display = 'block';
                setTimeout(() => targetPage.classList.add('active'), 50);
            }, 300);

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // OYUNLARI GÖSTƏRMƏK (2-li Grid)
        function renderGames(cityFilter = 'all') {
            const container = document.getElementById('games-container');
            container.innerHTML = '';

            const filteredGames = cityFilter === 'all' 
                ? gamesData 
                : gamesData.filter(g => g.city === cityFilter);

            filteredGames.forEach(game => {
                const card = document.createElement('div');
                card.className = "game-card bg-zinc-900/80 border border-zinc-800 rounded-xl overflow-hidden cursor-pointer shadow-lg";
                card.onclick = () => openGameDetail(game.id);

                card.innerHTML = `
                    <div class="relative h-64 overflow-hidden">
                        <img src="${game.image}" alt="${game.title}" class="w-full h-full object-cover">
                        <span class="absolute top-3 left-3 bg-red-950/90 text-red-400 text-xs px-3 py-1 rounded-full border border-red-800/60 font-semibold">
                            <i class="fa-solid fa-location-dot mr-1"></i>${game.cityLabel}
                        </span>
                    </div>

                    <div class="p-5">
                        <h3 class="font-tech text-2xl font-bold text-white mb-2">${game.title}</h3>
                        <div class="text-yellow-500 text-sm mb-1">${game.rating}</div>
                    </div>

                    <!-- Hover Pop-Up -->
                    <div class="hover-info-box p-4 rounded-lg shadow-2xl text-center">
                        <div class="grid grid-cols-2 gap-2 text-xs font-semibold text-zinc-300">
                            <div><i class="fa-solid fa-users text-red-500 mr-1"></i> Adam: ${game.players}</div>
                            <div><i class="fa-solid fa-clock text-red-500 mr-1"></i> ${game.duration}</div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterGamesByCity() {
            const selectedCity = document.getElementById('city-select').value;
            renderGames(selectedCity);
        }

        // OYUN DETAL / REZERVA SƏHİFƏSİ
        function openGameDetail(gameId) {
            const game = gamesData.find(g => g.id === gameId);
            if(!game) return;

            document.getElementById('detail-title').innerText = game.title;
            document.getElementById('detail-players').innerText = game.players + " Nəfər";
            document.getElementById('detail-duration').innerText = game.duration;
            document.getElementById('detail-rating').innerText = game.rating;
            document.getElementById('detail-image').src = game.image;
            document.getElementById('booking-game-id').value = game.id;

            navigateTo('detail-page');
        }

        // REZERVASİYA GÖNDƏRMƏK (Localstorage-ə saklanılır, Admin panel aýry html-den oxuya biler)
        function handleBookingSubmit(e) {
            e.preventDefault();
            
            let reservations = JSON.parse(localStorage.getItem('qorxu_reservations')) || [];

            const newRes = {
                id: Date.now(),
                gameId: document.getElementById('booking-game-id').value,
                name: document.getElementById('book-name').value,
                phone: document.getElementById('book-phone').value,
                date: document.getElementById('book-date').value,
                time: document.getElementById('book-time').value,
                count: document.getElementById('book-count').value,
                status: 'Gözləmədə'
            };

            reservations.push(newRes);
            localStorage.setItem('qorxu_reservations', JSON.stringify(reservations));

            alert('Təbrik edirik! Rezervasiyanız qeydə alındı.');
            document.getElementById('booking-form').reset();
            navigateTo('home-page');
        }
    </script>
</body>
</html>
